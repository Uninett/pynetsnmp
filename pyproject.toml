[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetsnmp-2"
version = "0.1.11"
description = "ctypes wrapper for net-snmp"
license = "GPL-2.0-or-later"
license-files = [
    "LICENSE.txt",
]
keywords = ["snmp", "twisted", "pynetsnmp", "netsnmp"]
authors = [{name = "Zenoss", email = "support@zenoss.com"}]
maintainers = [{name = "Morten Brekkevold", email = "morten.brekkevold@sikt.no"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
urls = {Homepage = "https://github.com/Uninett/pynetsnmp"}
dependencies = [
    "setuptools",
    "Twisted",
    "six",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = ["any"]

[tool.setuptools.packages]
find = {namespaces = false}
